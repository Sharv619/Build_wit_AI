<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>Pilly</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            background: "#fbf9f5",
            surface: "#ffffff",
            primary: "#4a6549",
            "primary-container": "#ccebc7",
            secondary: "#8b4e3d",
            "secondary-container": "#ffdbd1",
            tertiary: "#7d525f",
            error: "#ba1a1a",
            "error-container": "#ffdad6",
            outline: "#737970",
            "outline-variant": "#c3c8bf",
            "on-surface": "#1b1c1a",
            "on-surface-variant": "#434841"
          },
          fontFamily: {
            sans: ["Quicksand", "sans-serif"]
          }
        }
      }
    };
  </script>
  <style>
    body { font-family: "Quicksand", sans-serif; }
    .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 48; }
  </style>
</head>
<body class="min-h-screen bg-background text-on-surface">
  <header class="sticky top-0 z-40 bg-background/95 border-b border-outline-variant">
    <div class="mx-auto flex max-w-5xl items-center gap-4 px-6 py-4">
      <div class="flex h-12 w-12 items-center justify-center rounded-full bg-primary-container text-primary">
        <span class="material-symbols-outlined text-3xl">mic</span>
      </div>
      <div class="flex-1">
        <h1 class="text-3xl font-bold text-primary">Pilly</h1>
        <p id="connection-status" class="text-sm font-semibold text-on-surface-variant">Connecting to Firebase...</p>
      </div>
      <button id="seed-demo" class="rounded-full border-2 border-primary px-5 py-3 font-bold text-primary">Seed Demo</button>
    </div>
  </header>

  <main class="mx-auto grid max-w-5xl gap-6 px-6 py-6 lg:grid-cols-[1fr_1fr]">
    <section class="rounded-3xl border-2 border-[#E6E2D3] bg-surface p-6 shadow-[0_8px_30px_rgba(74,101,73,0.1)]">
      <div class="mb-6 flex items-start gap-4">
        <div class="flex h-16 w-16 items-center justify-center rounded-full bg-primary-container text-primary">
          <span class="material-symbols-outlined text-4xl">pill</span>
        </div>
        <div>
          <p class="text-sm font-bold uppercase tracking-widest text-secondary">Senior view</p>
          <h2 class="text-3xl font-bold">Eleanor's next event</h2>
          <p class="text-lg font-semibold text-on-surface-variant">Event-based, not clock-time based.</p>
        </div>
      </div>

      <div class="rounded-2xl bg-primary-container/35 p-5">
        <p class="text-lg font-bold text-primary">Current event</p>
        <select id="event-trigger" class="mt-3 h-14 w-full rounded-2xl border-2 border-outline-variant bg-white px-4 text-xl font-semibold">
          <option value="breakfast">Breakfast</option>
          <option value="lunch" selected>Lunch</option>
          <option value="dinner">Dinner</option>
          <option value="bedtime">Bedtime</option>
          <option value="leaving_home">Leaving home</option>
          <option value="post_discharge">Post-discharge</option>
          <option value="caregiver_check_in">Caregiver check-in</option>
        </select>
      </div>

      <div id="senior-med-list" class="mt-6 space-y-4"></div>

      <div class="mt-6 grid gap-3">
        <button id="play-reminder" class="h-16 rounded-full border-2 border-primary px-6 text-xl font-bold text-primary">
          <span class="material-symbols-outlined align-middle">volume_up</span>
          Play Reminder
        </button>
        <input id="response-text" class="h-16 rounded-2xl border-2 border-outline-variant px-5 text-xl font-semibold" placeholder="Type: I took it" />
        <button id="listen-response" class="h-16 rounded-full border-2 border-secondary px-6 text-xl font-bold text-secondary">
          <span class="material-symbols-outlined align-middle">mic</span>
          Speak Response
        </button>
        <button id="record-response" class="h-16 rounded-full bg-primary px-6 text-xl font-bold text-white">Record Response</button>
        <button id="complete-event" class="h-16 rounded-full bg-secondary-container px-6 text-xl font-bold text-secondary">Complete Event</button>
        <button id="leaving-home" class="h-16 rounded-full border-2 border-tertiary px-6 text-xl font-bold text-tertiary">Simulate Leaving Home</button>
      </div>
    </section>

    <section class="space-y-6">
      <div class="rounded-3xl border-2 border-[#E6E2D3] bg-surface p-6 shadow-[0_8px_30px_rgba(74,101,73,0.1)]">
        <h2 class="text-3xl font-bold">Add Medication</h2>
        <div class="mt-5 grid gap-4">
          <input id="med-name" class="h-16 rounded-2xl border-2 border-outline-variant px-5 text-xl font-semibold" placeholder="Medication name" value="Post-hospital antibiotic" />
          <input id="med-dose" class="h-16 rounded-2xl border-2 border-outline-variant px-5 text-xl font-semibold" placeholder="Dose" value="1 tablet" />
          <textarea id="med-instructions" class="min-h-28 rounded-2xl border-2 border-outline-variant p-5 text-xl font-semibold" placeholder="Instructions">Temporary medicine outside the Webster Pack.</textarea>
          <select id="med-source" class="h-16 rounded-2xl border-2 border-outline-variant bg-white px-5 text-xl font-semibold">
            <option value="webster_pack">Webster Pack</option>
            <option value="temporary_post_hospital">Temporary post-hospital</option>
            <option value="antibiotic" selected>Antibiotic</option>
            <option value="other">Other</option>
          </select>
          <button id="save-medication" class="h-16 rounded-full bg-primary px-6 text-xl font-bold text-white">Save Medication For Event</button>
        </div>
      </div>

      <div class="rounded-3xl border-2 border-[#E6E2D3] bg-surface p-6 shadow-[0_8px_30px_rgba(74,101,73,0.1)]">
        <div class="flex items-center justify-between gap-4">
          <div>
            <p class="text-sm font-bold uppercase tracking-widest text-secondary">Caregiver dashboard</p>
            <h2 class="text-3xl font-bold">Live Firestore status</h2>
          </div>
          <span class="material-symbols-outlined text-4xl text-primary">monitoring</span>
        </div>
        <div id="caregiver-dashboard" class="mt-5 space-y-4"></div>
      </div>
    </section>
  </main>

  <footer class="border-t-4 border-secondary bg-[#f5f3ef] px-6 py-5 text-center">
    <p class="mx-auto max-w-3xl text-lg font-bold text-secondary">Pilly does not provide medical advice. Always follow your doctor's or pharmacist's instructions.</p>
  </footer>

  <script src="firebase-config.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
